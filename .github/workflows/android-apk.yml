
name: AWAPART66 v264 FINAL BUILD

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build signed APK and AAB
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test APK
        if: ${{ !inputs.release }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload test APK
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: AWAPART66-v264-PRODUCTION-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build and verify signed release
        if: ${{ inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.AW66_KEYSTORE_B64 }}
          AW66_STORE_PASSWORD: ${{ secrets.AW66_STORE_PASSWORD }}
          AW66_KEY_ALIAS: ${{ secrets.AW66_KEY_ALIAS }}
          AW66_KEY_PASSWORD: ${{ secrets.AW66_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_B64:?Missing keystore secret}"
          : "${AW66_STORE_PASSWORD:?Missing store password}"
          : "${AW66_KEY_ALIAS:?Missing key alias}"
          : "${AW66_KEY_PASSWORD:?Missing key password}"

          umask 077
          export AW66_KEYSTORE_PATH="$RUNNER_TEMP/aw66-release.jks"
          trap 'rm -f "$AW66_KEYSTORE_PATH"' EXIT

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$AW66_KEYSTORE_PATH"

          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab

          test -s "$APK"
          test -s "$AAB"

          jarsigner -verify "$AAB"

          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK"

      - name: Upload final APK and AAB
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: AWAPART66-v264-SIGNED-RELEASE
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
