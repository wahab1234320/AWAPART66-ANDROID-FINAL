
name: AWAPART66 APK BUILD V3
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build signed release (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build debug APK
        if: ${{ !inputs.release }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: AWAPART66-v252-PRODUCTION-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build and verify signed release
        if: ${{ inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.AW66_KEYSTORE_B64 }}
          AW66_STORE_PASSWORD: ${{ secrets.AW66_STORE_PASSWORD }}
          AW66_KEY_ALIAS: ${{ secrets.AW66_KEY_ALIAS }}
          AW66_KEY_PASSWORD: ${{ secrets.AW66_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing keystore secret}" "${AW66_STORE_PASSWORD:?Missing store password}" "${AW66_KEY_ALIAS:?Missing alias}" "${AW66_KEY_PASSWORD:?Missing key password}"
          umask 077
          export AW66_KEYSTORE_PATH="$RUNNER_TEMP/aw66-release.jks"
          trap 'rm -f "$AW66_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$AW66_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release }}
        with:
          name: AWAPART66-v252-SIGNED-RELEASE
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
