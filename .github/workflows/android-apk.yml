name: AWAPART66 PRO V254 STAGING BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout V254 Staging
        uses: actions/checkout@v4
        with:
          ref: staging-v254

      - name: Verify Application Version
        run: |
          grep -E "versionName[[:space:]]+['\"]2\.5\.4['\"]" app/build.gradle
          echo "AWAPART66 VERSION 2.5.4 VERIFIED"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        run: |
          sdkmanager "platforms;android-35"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Build APK V254
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK V254
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/AWAPART66-PRO-v2.5.4-STAGING.apk

      - name: Upload APK V254
        uses: actions/upload-artifact@v4
        with:
          name: AWAPART66-v254-STAGING-TEST-APK
          path: output/AWAPART66-PRO-v2.5.4-STAGING.apk
          if-no-files-found: error
