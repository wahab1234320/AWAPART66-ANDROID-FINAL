name: AWAPART66 PRO V254 STAGING BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Build APK V254
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK V254
        uses: actions/upload-artifact@v4
        with:
          name: AWAPART66-v254-STAGING-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
