<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pendaftaran pemilik</title><style>body{font:16px system-ui;color:#172033;margin:0;padding:24px}main{max-width:540px;margin:24px auto;background:white;padding:28px;border-radius:20px;box-shadow:0 12px 40px #10213a22}label{display:block;margin:12px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:9px;font:inherit}button{background:#c9a45c;font-weight:700;margin-top:12px}a{color:#172033}</style><link rel="stylesheet" href="/premium.css?v=255"></head><body><main><div class="premium-hero" style="color:white;padding:24px;border-radius:14px">AWAPART 66 PRO<h1>Pendaftaran pemilik</h1></div><p>1. Informasi properti · 2. Verifikasi email dan buat password · 3. Persetujuan Admin</p><form><label>Nama lengkap<input name="full_name" required maxlength="120"></label><label>Email<input name="email" type="email" required></label><label>WhatsApp<input name="phone" type="tel" required></label><label>Nama properti<input name="property_name" required maxlength="160"></label><label>Lokasi<input name="property_location" required maxlength="200"></label><label>Jumlah unit<input name="unit_count" type="number" min="1" max="10000" required></label><button>Verifikasi email & lanjutkan</button></form><p id="result" role="status"></p><a href="/portal.html?access=owner">Kembali ke login</a></main><script src="/owner-apply.js"></script></body></html>
